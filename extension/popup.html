<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 250px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #38bdf8;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      margin: 0 0 10px 0;
      line-height: 1.4;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #10b981;
    }
  </style>
</head>
<body>
  <h3>Learning Companion</h3>
  <p>Monitors classroom tab focus to help keep you engaged during live online lectures.</p>
  <div class="status">
    <span>🟢</span> Active & Monitoring
  </div>
</body>
</html>
