<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ClassPulse Companion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 330px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 0;
      background: #ffffff;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #0a152d;
      color: #ffffff;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-badge {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
    }
    .version {
      font-size: 10px;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .content {
      padding: 16px;
    }
    .status-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .status-label {
      color: #64748b;
      font-weight: 500;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      font-size: 11px;
      color: #047857;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      display: inline-block;
    }
    .dot.active {
      background-color: #10b981;
    }
    .dot.idle {
      background-color: #f59e0b;
    }
    .dot.away {
      background-color: #f43f5e;
    }
    .dot.offline {
      background-color: #94a3b8;
    }
    .field {
      margin-bottom: 12px;
    }
    .label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      color: #0f172a;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus {
      border-color: #0a152d;
    }
    input::placeholder {
      color: #94a3b8;
    }
    .btn {
      width: 100%;
      background: #0a152d;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transform: scale(1);
      transition: transform 0.12s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.15s;
    }
    .btn:hover {
      background: #132347;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      margin-top: 6px;
    }
    .btn-secondary:hover {
      background: #f8fafc;
      color: #0f172a;
      border-color: #94a3b8;
    }
    .btn-secondary:active {
      transform: scale(0.98);
    }
    .footer {
      margin-top: 14px;
      font-size: 10px;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
    }
    .toast {
      display: none;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      border-radius: 6px;
      padding: 6px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <div class="icon-badge">CP</div>
      <div class="title">ClassPulse Companion</div>
    </div>
    <span class="version">v1.2.0</span>
  </div>

  <div class="content">
    <div class="status-card">
      <div class="status-row">
        <span class="status-label">Focus State:</span>
        <span class="status-badge" id="hud-status">
          <span class="dot active"></span> Active
        </span>
      </div>
      <div class="status-row">
        <span class="status-label">Google Meet Hook:</span>
        <span style="color: #0284c7; font-weight: 600; font-size: 11px;" id="meet-status">Ready</span>
      </div>
      <div class="status-row">
        <span class="status-label">Server Feed:</span>
        <span class="status-badge" id="ws-status" style="color: #64748b;">
          <span class="dot active"></span> Connected
        </span>
      </div>
    </div>

    <div class="field">
      <label class="label">Student Name</label>
      <input type="text" id="studentName" placeholder="Your Name (e.g. Alex Chen)" />
    </div>

    <div class="field">
      <label class="label">Session ID</label>
      <input type="text" id="sessionId" value="live-demo-session" placeholder="e.g. live-demo-session" />
    </div>

    <div class="field">
      <label class="label">Backend WebSocket URL</label>
      <input type="text" id="wsBaseUrl" value="wss://hope-wesley-strategic-generated.trycloudflare.com/ws/session" />
    </div>

    <button class="btn" id="saveBtn">Save & Sync Settings</button>
    <button class="btn btn-secondary" id="openMeetBtn">Open Google Meet ↗</button>
    <button class="btn btn-secondary" id="openPortalBtn">Open Classroom Portal ↗</button>

    <div class="toast" id="toastMsg">✓ Settings saved & synced!</div>

    <div class="footer">
      Privacy Guaranteed: Zero biometric facial AI or continuous video recording.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
